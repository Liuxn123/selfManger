name: Desktop CI and packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: windows-latest
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install
        run: python -m pip install -e ".[build]" -r requirements-build.txt
      - name: Compile and test
        env:
          SELFMANGER_TEST_ROOT: ${{ runner.temp }}/selfManger-ci
        run: |
          python -m compileall -q src scripts
          python scripts/run_tests.py --timeout 120 --output "${{ runner.temp }}/selfManger-ci/ci-tests"
      - name: Build
        run: python scripts/build.py
      - name: Validate frozen package
        run: python scripts/smoke_package.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: selfManger-windows-latest
          path: |
            dist/selfManger-*.zip
            dist/selfManger-*.tar.gz
            build/smoke.png
            ${{ runner.temp }}/selfManger-ci/ci-tests/*.log
            ${{ runner.temp }}/selfManger-ci/ci-tests/summary.json
          if-no-files-found: error
          retention-days: 14
